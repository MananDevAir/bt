name: Deploy on Push

on:
  push:
    branches: [main]
    paths-ignore:
      - 'data/**'      # CRITICAL: DB auto-commits must NOT re-trigger tests
      - '**.md'
      - '**.json'

jobs:
  test-and-notify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
      - run: python -m pip install -r requirements.txt -q
      - name: Dummy test (saves build time)
        run: python -c "assert 1 + 2 == 3; print('Dummy test passed!')"
