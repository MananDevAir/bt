name: Signal Bot 24/7

on:
  schedule:
    - cron: '0 */6 * * *'  # Safety net restart every 6 hours
  workflow_dispatch:        # Allows manual trigger or self-dispatching relay

concurrency:
  group: signal-bot-relay
  cancel-in-progress: false

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 360    # 6 hours maximum per runner
    permissions:
      contents: write       # Required to commit database back
      actions: write        # Required to trigger next relay runner

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run 24/7 Continuous Relay Runner
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_BACKUP_TOKEN: ${{ secrets.HF_BACKUP_TOKEN }}
          TWELVEDATA_KEY: ${{ secrets.TWELVEDATA_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python run_bot.py --continuous
