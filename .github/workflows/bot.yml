# DISABLED — Bot is now deployed as a 24/7 process on Kerit Cloud / Pterodactyl.
# This GitHub Actions cron was the old relay architecture. Keeping file for reference only.
# Cron triggers have been removed. Only manual dispatch is available for testing.

name: Signal Bot

on:
  workflow_dispatch:  # Manual trigger only

jobs:
  scan:
    name: Scan markets (manual only)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Safety gate — set to true to re-enable automated runs
    if: false
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install dependencies
        run: python -m pip install -r requirements.txt -q

      - name: Smoke test
        run: python -c "from src.config import load; from src.analysis.confluence import score_symbol; print('OK')"

      - name: Run scan
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python run_bot.py --scan-once --live
