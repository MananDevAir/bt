[pytest]
# `pythonpath = .` lets tests do `from src.analysis import ...` without an
# editable install; `testpaths = tests` keeps the legacy root-level
# test_phase*.py scripts (which hit live APIs) out of the offline suite.
pythonpath = .
testpaths = tests
addopts = -q --strict-markers
filterwarnings =
    ignore::DeprecationWarning:yfinance.*
